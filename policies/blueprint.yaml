# Loop decision blueprint — the critic set, selection key, and promote strategy
# the harness loop uses. Edit to reconfigure the loop without code changes.
#
# A critic is either a bare name or {name, params}. To gate on per-golden
# regressions, add e.g.:
#   - {name: regression_budget, params: {max_regressions: 1}}
#
# selection: selection_key (pass-rate -> quality -> latency) or two_tier
# (pass-rate -> latency, the Paper-2 literal).
version: 1
pre_critics:
  - scope
post_critics:
  - eval_lift
selection: selection_key
promote_strategy: best
