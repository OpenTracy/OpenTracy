[project]
name = "opentracy"
version = "0.1.0"
description = "OpenTracy — an agent architecture built on tools, skills, and memory"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
anthropic = ["anthropic>=0.116"]

[project.scripts]
opentracy = "opentracy.gateway.cli:main"
ot = "opentracy.gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opentracy"]
